version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    # AAASM-6210: every name here must exist as a repository label. Dependabot
    # does not fail on a name that does not exist — it silently applies the
    # subset that does and drops the rest, so a wrong name is invisible on the
    # pull request. The emoji-prefixed names previously listed in this file
    # existed in no repo in the fleet, so only "dependencies" was ever applied.
    labels:
      - "github-actions"
      - "dependencies"
    commit-message:
      prefix: ⬆
    # AAASM-6239: github/codeql-action/init and /analyze are separate
    # dependencies to Dependabot, but analyze refuses a configuration file
    # written by a different version of init ("Loaded a configuration file for
    # version '4.38.2', but running version '4.38.1'"). Ungrouped, one upstream
    # release opens one pull request per step and neither can ever merge: every
    # language leg fails and the top-level CodeQL check degrades to neutral, so
    # the page shows a CodeQL entry that is not red while no analysis ran at
    # all.
    #
    # Both groups are required. applies-to defaults to version-updates, so a
    # single entry would leave the security-advisory path splitting exactly as
    # before -- which is the path that matters most.
    groups:
      codeql-action:
        applies-to: version-updates
        patterns:
          - "github/codeql-action*"
      codeql-action-security:
        applies-to: security-updates
        patterns:
          - "github/codeql-action*"

  # Python
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
    labels:
      - "python"
      - "dependencies"
    commit-message:
      prefix: ⬆

  # Rust native binding (PyO3) — native/aa-ffi-python
  - package-ecosystem: "cargo"
    directory: "/native/aa-ffi-python"
    schedule:
      interval: "daily"
    labels:
      - "rust"
      - "dependencies"
    commit-message:
      prefix: ⬆
