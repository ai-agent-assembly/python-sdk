name: Run test and organize test coverage reports

on:
  workflow_call:
    inputs:
      run_e2e:
        description: "The testing type. In generally, it only has 2 options: 'unit-test' and 'integration-test'."
        type: boolean
        required: false
        default: false
      operating-systems:
        description: "JSON array string of runner OSes for the test matrix. Callers pass [\"ubuntu-latest\"] for PRs and the full 4-OS list for push/scheduled/release."
        type: string
        required: false
        default: '["ubuntu-latest", "ubuntu-22.04", "macos-latest", "macos-15"]'
    secrets:
      e2e_test_api_token:
        description: "Set the Slack bot token for end-to-end test."
        required: false

# AAASM-3993: least-privilege default token. As a reusable workflow this also caps
# the GITHUB_TOKEN granted to the third-party workflows it calls; none need write.
permissions:
  contents: read

jobs:
  # AAASM-3994: these jobs call a third-party reusable workflow owned by a personal
  # account (Chisanan232/GitHub-Action_Reusable_Workflows-Python). Trust is bounded
  # by the 40-char commit-SHA pin on each `uses:` below — a moving tag/branch would
  # let the owner alter behavior after review. Secrets are already scoped per call:
  # only run_e2e-test receives e2e_test_api_token (Slack); unit/integration forward
  # none. TODO(AAASM-3994): vendor this workflow into the ai-agent-assembly org (or
  # pin a signed release) to drop the personal-account supply-chain dependency.
  run_unit-test:
#    name: Run all unit test items
    uses: Chisanan232/GitHub-Action_Reusable_Workflows-Python/.github/workflows/rw_uv_run_test.yaml@4a6480470b90c0b6139e05489868585fa50aad6f  # master @ 2026-05-26
    with:
      test_type: unit-test
      test_folder: './test/unit'
      install_dependency_with_group: 'dev'
      python-versions: '["3.13"]'
      operating-systems: ${{ inputs.operating-systems }}

  run_integration-test:
#    name: Run all integration test items
    uses: Chisanan232/GitHub-Action_Reusable_Workflows-Python/.github/workflows/rw_uv_run_test.yaml@4a6480470b90c0b6139e05489868585fa50aad6f  # master @ 2026-05-26
    with:
      test_type: integration-test
      test_folder: './test/integration'
      install_dependency_with_group: 'dev'
      python-versions: '["3.13"]'
      operating-systems: ${{ inputs.operating-systems }}

  run_e2e-test:
#    name: Run all end-to-end test items
    if: ${{ inputs.run_e2e == true }}
    uses: Chisanan232/GitHub-Action_Reusable_Workflows-Python/.github/workflows/rw_uv_run_test.yaml@4a6480470b90c0b6139e05489868585fa50aad6f  # master @ 2026-05-26
    with:
      test_type: e2e-test
      test_folder: './test/e2e'
      install_dependency_with_group: 'dev'
      max-parallel: 1
      python-versions: '["3.13"]'
      operating-systems: ${{ inputs.operating-systems }}
    secrets:
      e2e_test_api_token: ${{ secrets.e2e_test_api_token }}

  unit-test_codecov:
#    name: For unit test, organize and generate the testing report and upload it to Codecov
    if: ${{
        contains(fromJSON('["pull_request","workflow_dispatch","schedule"]'), github.event_name) ||
        (github.event_name == 'push' && github.ref_name == 'main')
      }}
    needs: run_unit-test
    uses: Chisanan232/GitHub-Action_Reusable_Workflows-Python/.github/workflows/rw_organize_test_cov_reports.yaml@4a6480470b90c0b6139e05489868585fa50aad6f  # master @ 2026-05-26
    with:
      test_type: unit-test
      source_folder: agent_assembly

  integration-test_codecov:
#    name: For unit test, organize and generate the testing report and upload it to Codecov
    if: ${{
        contains(fromJSON('["pull_request","workflow_dispatch","schedule"]'), github.event_name) ||
        (github.event_name == 'push' && github.ref_name == 'main')
      }}
    needs: run_integration-test
    uses: Chisanan232/GitHub-Action_Reusable_Workflows-Python/.github/workflows/rw_organize_test_cov_reports.yaml@4a6480470b90c0b6139e05489868585fa50aad6f  # master @ 2026-05-26
    with:
      test_type: integration-test
      source_folder: agent_assembly

  e2e-test_codecov:
#    name: For end-to-end test, organize and generate the testing report and upload it to Codecov
    if: ${{
        contains(fromJSON('["pull_request","workflow_dispatch","schedule"]'), github.event_name) ||
        (github.event_name == 'push' && github.ref_name == 'main')
      }}
    needs: run_e2e-test
    uses: Chisanan232/GitHub-Action_Reusable_Workflows-Python/.github/workflows/rw_organize_test_cov_reports.yaml@4a6480470b90c0b6139e05489868585fa50aad6f  # master @ 2026-05-26
    with:
      test_type: e2e-test
      source_folder: agent_assembly

  all_test_not_e2e_test_codecov:
#    name: Organize and generate the testing report and upload it to Codecov
    if: ${{
        (
            contains(fromJSON('["pull_request","workflow_dispatch","schedule"]'), github.event_name) ||
            (github.event_name == 'push' && github.ref_name == 'main')
        ) &&
        inputs.run_e2e == false
      }}
#    needs: [run_unit-test, run_integration-test, run_contract-test]
    needs: [run_unit-test, run_integration-test]
    uses: Chisanan232/GitHub-Action_Reusable_Workflows-Python/.github/workflows/rw_organize_test_cov_reports.yaml@4a6480470b90c0b6139e05489868585fa50aad6f  # master @ 2026-05-26
    with:
      test_type: all-test
      source_folder: agent_assembly

  all_test_include_e2e_test_codecov:
#    name: Organize and generate the testing report and upload it to Codecov
    if: ${{
        (
            contains(fromJSON('["pull_request","workflow_dispatch","schedule"]'), github.event_name) ||
            (github.event_name == 'push' && github.ref_name == 'main')
        ) &&
        inputs.run_e2e == true
      }}
#    needs: [run_unit-test, run_integration-test, run_contract-test, run_e2e-test]
    needs: [run_unit-test, run_integration-test, run_e2e-test]
    uses: Chisanan232/GitHub-Action_Reusable_Workflows-Python/.github/workflows/rw_organize_test_cov_reports.yaml@4a6480470b90c0b6139e05489868585fa50aad6f  # master @ 2026-05-26
    with:
      test_type: all-test
      source_folder: agent_assembly
