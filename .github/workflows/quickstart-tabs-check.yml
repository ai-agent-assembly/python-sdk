name: Quick-start Tabs Drift Check

# AAASM-4513: the per-framework tab block in docs/quick-start.md §3 is generated
# from the vendored quickstart_snippets/ (a committed copy of the examples repo's
# quick-start regions — examples is a separate repo, so the doc build stays
# hermetic). This gate re-runs the generator and fails if the committed doc no
# longer matches the vendored snippets + manifest, so the tabs can never drift.

on:
  pull_request:
    paths:
      - "quickstart_snippets/**"
      - "scripts/generate_quickstart_tabs.py"
      - "docs/quick-start.md"
      - ".github/workflows/quickstart-tabs-check.yml"
#     AAASM-5529: the claim-binding gate below reads the negative controls and the
#     exception the quick-start names, so an edit to either must re-run it here.
#     ci.yaml already covers them under agent_assembly/**/*.py and test/**/*.py;
#     these entries matter for the docs-only PR, which ci.yaml deliberately skips.
      - "test/unit/test_quickstart_claim_bindings.py"
      - "test/unit/test_quickstart_negative_control.py"
#     AAASM-5661: the second control module the gate reads — the one that runs the
#     documented configuration with no fake native core.
      - "test/unit/test_quickstart_documented_configuration.py"
      - "agent_assembly/exceptions/**"
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  drift-check:
    name: quick-start tabs drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Regenerate quick-start framework tabs
        run: python scripts/generate_quickstart_tabs.py

      - name: Fail if regeneration produced a diff
        run: |
          if ! git diff --exit-code; then
            echo "::error::docs/quick-start.md §3 is out of sync with quickstart_snippets/."
            echo "::error::Snippet source: quickstart_snippets/ (vendored from ai-agent-assembly/examples, AAASM-4512)."
            echo "::error::Run the generator locally and commit the result:"
            echo "::error::  python scripts/generate_quickstart_tabs.py"
            exit 1
          fi

  claim-bindings:
    # AAASM-5529. The drift-check job above round-trips the §3 tabs as *text*: it
    # proves the generated document matches the vendored snippets and nothing
    # more — the snippets are never parsed, imported or executed (ruff.toml
    # excludes them; they reference names they never define).
    #
    # This job gates a different surface: §"What just happened", where the
    # quick-start states what governance did. It binds each claim to the control
    # that proves it, so a claim cannot be added or reworded without someone
    # naming the evidence.
    #
    # It runs here rather than only in ci.yaml because ci.yaml's paths allow-list
    # excludes docs/**, so a docs-only PR — precisely the change that rewords a
    # claim — gets no CI at all.
    name: quick-start claim bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0

      - name: Install the SDK and its dev dependencies
        run: uv sync

      # AAASM-5661: the controls run here too, not only the bindings. A binding
      # names a control by node id, and the gate checks the id still exists — it
      # cannot tell whether that control still passes. On a docs-only PR ci.yaml
      # does not run, so without this the named evidence went unexecuted.
      - name: Every documented enforcement claim names the control that proves it
        run: >-
          uv run pytest
          test/unit/test_quickstart_claim_bindings.py
          test/unit/test_quickstart_documented_configuration.py
          -q --no-cov
