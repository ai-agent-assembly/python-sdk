name: CI

on:
  workflow_call:
    inputs:
      run_e2e:
        description: "The testing type. In generally, it only has 2 options: 'unit-test' and 'integration-test'."
        type: boolean
        required: false
        default: false
      operating-systems:
        description: "JSON array string of runner OSes for the test matrix. Forwarded to rw_build_and_test."
        type: string
        required: false
        default: '["ubuntu-latest", "ubuntu-22.04", "macos-latest", "macos-14"]'
    secrets:
      e2e_test_api_token:
        description: "Set the Slack bot token for end-to-end test."
        required: false
      codecov_token:
        description: "The API token for uploading testing coverage report to Codecov."
        required: false
      sonar_token:
        description: "The API token for uploading testing coverage report to Coveralls."
        required: false

# AAASM-3993: least-privilege default token. As a reusable workflow this also caps
# the GITHUB_TOKEN granted to the third-party workflows it calls; none need write.
permissions:
  contents: read

jobs:
  build-and-test:
#    name: Run all tests and organize all test reports
    uses: ./.github/workflows/rw_build_and_test.yaml
    with:
      run_e2e: ${{ inputs.run_e2e }}
      operating-systems: ${{ inputs.operating-systems }}
    secrets:
      e2e_test_api_token: ${{ secrets.e2e_test_api_token }}

  # AAASM-3994: the *_codecov_finish jobs below call a third-party reusable workflow
  # owned by a personal account (Chisanan232/GitHub-Action_Reusable_Workflows-Python).
  # Trust is bounded by the 40-char commit-SHA pin on each `uses:` — a moving ref
  # would let the owner alter behavior after review. Secrets are already minimized:
  # each call forwards ONLY codecov_token; sonar_token is used solely by the local
  # sonarcloud_finish job (SonarSource action) and never forwarded to the third party.
  # TODO(AAASM-3994): vendor this workflow into the ai-agent-assembly org (or pin a
  # signed release) to drop the personal-account supply-chain dependency.
  unit-test_codecov_finish:
#    name: Organize and generate the testing report and upload it to Codecov
    if: ${{
        github.actor != 'dependabot[bot]' &&
        !contains(github.event.pull_request.labels.*.name, 'dependencies') && 
        (
            contains(fromJSON('["pull_request","workflow_dispatch","schedule"]'), github.event_name) || 
            (github.event_name == 'push' && github.ref_name == 'main')
        ) 
      }}
    needs: build-and-test
    uses: Chisanan232/GitHub-Action_Reusable_Workflows-Python/.github/workflows/rw_upload_test_cov_report.yaml@4a6480470b90c0b6139e05489868585fa50aad6f # master (4a64804, 2026-05-26)
    secrets:
      codecov_token: ${{ secrets.codecov_token }}
    with:
      test_type: unit-test
      upload-to-codecov: true
      codecov_flags: unit  # Required if 'upload-to-codecov' is true
      codecov_name: agent-assembly  # Required if 'upload-to-codecov' is true
      codecov_slug: ai-agent-assembly/python-sdk

  integration-test_codecov_finish:
#    name: Organize and generate the testing report and upload it to Codecov
    if: ${{
        github.actor != 'dependabot[bot]' &&
        !contains(github.event.pull_request.labels.*.name, 'dependencies') &&
        (
            contains(fromJSON('["pull_request","workflow_dispatch","schedule"]'), github.event_name) ||
            (github.event_name == 'push' && github.ref_name == 'main')
        )
      }}
    needs: build-and-test
    uses: Chisanan232/GitHub-Action_Reusable_Workflows-Python/.github/workflows/rw_upload_test_cov_report.yaml@4a6480470b90c0b6139e05489868585fa50aad6f # master (4a64804, 2026-05-26)
    secrets:
      codecov_token: ${{ secrets.codecov_token }}
    with:
      test_type: integration-test
      upload-to-codecov: true
      codecov_flags: integration  # Required if 'upload-to-codecov' is true
      codecov_name: agent-assembly  # Required if 'upload-to-codecov' is true
      codecov_slug: ai-agent-assembly/python-sdk

  e2e-test_codecov_finish:
#    name: Organize and generate the testing report and upload it to Codecov
    if: ${{
        github.actor != 'dependabot[bot]' &&
        !contains(github.event.pull_request.labels.*.name, 'dependencies') &&
        (
            (contains(fromJSON('["pull_request","workflow_dispatch","schedule"]'), github.event_name) ||
            (github.event_name == 'push' && github.ref_name == 'main')
        )) &&
        inputs.run_e2e == true
      }}
    needs: build-and-test
    uses: Chisanan232/GitHub-Action_Reusable_Workflows-Python/.github/workflows/rw_upload_test_cov_report.yaml@4a6480470b90c0b6139e05489868585fa50aad6f # master (4a64804, 2026-05-26)
    secrets:
      codecov_token: ${{ secrets.codecov_token }}
    with:
      test_type: e2e-test
      upload-to-codecov: true
      codecov_flags: e2e  # Required if 'upload-to-codecov' is true
      codecov_name: agent-assembly  # Required if 'upload-to-codecov' is true
      codecov_slug: ai-agent-assembly/python-sdk

  contract-test_codecov_finish:
#    name: Organize and generate the testing report and upload it to Codecov
    if: ${{
        github.actor != 'dependabot[bot]' &&
        !contains(github.event.pull_request.labels.*.name, 'dependencies') &&
        (
            contains(fromJSON('["pull_request","workflow_dispatch","schedule"]'), github.event_name) ||
            (github.event_name == 'push' && github.ref_name == 'main')
        )
      }}
    needs: build-and-test
    uses: Chisanan232/GitHub-Action_Reusable_Workflows-Python/.github/workflows/rw_upload_test_cov_report.yaml@4a6480470b90c0b6139e05489868585fa50aad6f # master (4a64804, 2026-05-26)
    secrets:
      codecov_token: ${{ secrets.codecov_token }}
    with:
      test_type: contract-test
      upload-to-codecov: true
      codecov_flags: contract  # Required if 'upload-to-codecov' is true
      codecov_name: agent-assembly  # Required if 'upload-to-codecov' is true
      codecov_slug: ai-agent-assembly/python-sdk

  all-test_codecov_finish:
#    name: Organize and generate the testing report and upload it to Codecov
    if: ${{
        github.actor != 'dependabot[bot]' &&
        !contains(github.event.pull_request.labels.*.name, 'dependencies') &&
        (
            contains(fromJSON('["pull_request","workflow_dispatch","schedule"]'), github.event_name) ||
            (github.event_name == 'push' && github.ref_name == 'main')
        )
      }}
    needs: build-and-test
    uses: Chisanan232/GitHub-Action_Reusable_Workflows-Python/.github/workflows/rw_upload_test_cov_report.yaml@4a6480470b90c0b6139e05489868585fa50aad6f # master (4a64804, 2026-05-26)
    secrets:
      codecov_token: ${{ secrets.codecov_token }}
    with:
      test_type: all-test
      upload-to-codecov: true
      codecov_flags: all  # Required if 'upload-to-codecov' is true
      codecov_name: agent-assembly  # Required if 'upload-to-codecov' is true
      codecov_slug: ai-agent-assembly/python-sdk

  sonarcloud_finish:
#    name: SonarCloud Scan
    if: ${{
        github.actor != 'dependabot[bot]' &&
        !contains(github.event.pull_request.labels.*.name, 'dependencies') &&
        (
            contains(fromJSON('["pull_request","workflow_dispatch","schedule"]'), github.event_name) ||
            (github.event_name == 'push' && github.ref_name == 'main')
        )
      }}
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # Required by SonarCloud to correctly compute PR/new-code deltas.
          fetch-depth: 0

      - name: Download all-test coverage XML report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: all-test_coverage_xml_report
          path: ./

      - name: Verify coverage XML report exists
        run: |
          if [ ! -f "./coverage_all-test.xml" ]; then
            echo "Expected coverage report ./coverage_all-test.xml not found."
            echo "Current files:"
            ls -la
            exit 1
          fi

      # Derive the analysis version from the package's own pyproject.toml so the
      # SonarCloud quality gate always tracks the current release. A literal
      # sonar.projectVersion=0.0.0 leaves the gate stuck at "Not computed"
      # (AAASM-3815); passing the live version below overrides the static
      # fallback in sonar-project.properties.
      - name: Resolve project version
        id: sonar_version
        run: |
          version="$(grep -m1 -E '^version = ' pyproject.toml | sed -E 's/^version = "(.*)"/\1/')"
          if [ -z "$version" ]; then
            echo "Could not parse version from pyproject.toml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SONAR_TOKEN: ${{ secrets.sonar_token }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.projectVersion=${{ steps.sonar_version.outputs.version }}
