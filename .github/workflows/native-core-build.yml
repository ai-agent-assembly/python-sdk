name: Native Core Build Check

on:
  pull_request:
    paths:
      - "native/**"
      # FFI-binding Python files that import the native `_core` module.
      - "agent_assembly/__init__.py"
      - "agent_assembly/types.py"
      # The modules test_native_core_runtime.py drives through `_core`.
      - "agent_assembly/core/**"
      - "test/integration/test_native_core_runtime.py"
      - ".github/workflows/native-core-build.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# AAASM-3993: least-privilege default token — this workflow only checks out and
# runs tests/builds; no job pushes, comments, or deploys.
permissions:
  contents: read

jobs:
  build-native-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Create virtual environment
        run: uv venv

      - name: Build native module with maturin
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
        run: uv tool run maturin develop --manifest-path native/aa-ffi-python/Cargo.toml

      - name: Verify native module import
        run: |
          uv run python -c "from agent_assembly._core import RuntimeClient, GovernanceEvent"

      # AAASM-6359: this file skips itself unless the gate variable is "1", and a
      # skip exits 0, so a typo'd/removed variable would turn the job into a
      # silent pass. `-o addopts=""` drops pytest.ini's `--reruns 1` (a retry
      # would hide a flaky timing assertion) and the coverage plugins; the
      # junit check fails the job if anything was skipped.
      - name: Run native core runtime tests
        env:
          AAASM_RUN_NATIVE_CORE_TESTS: "1"
        run: |
          uv run --with pytest python -m pytest -o addopts="" -rs \
            --junitxml=native-core-runtime.xml \
            test/integration/test_native_core_runtime.py
          grep -q 'skipped="0"' native-core-runtime.xml
