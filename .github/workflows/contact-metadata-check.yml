name: Contact Metadata Drift Check

# AAASM-5520: the maintainer email in pyproject.toml and the security contact
# region in SECURITY.md are owned by the canonical org metadata registry in
# ai-agent-assembly/.github (ADR 0014 / AAASM-5519). scripts/check_contact_metadata.py
# syncs/audits them against the pinned canonical facts. This gate fails closed
# if either drifts, so a stale contact literal can never merge.

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "SECURITY.md"
      - "scripts/check_contact_metadata.py"
      - ".github/workflows/contact-metadata-check.yml"
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contact-drift:
    name: contact metadata drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Audit contact literals against the pinned registry
        run: python scripts/check_contact_metadata.py --check
