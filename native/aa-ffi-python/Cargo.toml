[package]
name = "aa-ffi-python"
version = "0.0.0"
edition = "2021"
description = "PyO3 bridge crate for the Agent Assembly Python SDK"
license = "MIT"

[lib]
name = "aa_ffi_python"
crate-type = ["cdylib"]

[dependencies]
# Shared crates consumed via git-SHA pin (ADR 0002, AAASM-2559). aa-core,
# aa-proto, and aa-sdk-client must share one SHA so cargo resolves a single
# checkout of the agent-assembly workspace.
#
# Pinned to the agent-assembly merge commit of AAASM-6451 (main d4093e89b). It carries
# AAASM-6447/6451: `AssemblyConfig::org_id` and `registration_key` (the org claim and the
# operator key the gateway binds it to) and the gateway-restart re-bind, and it keeps the
# AAASM-5839 fix (query_policy sends the registered did:key DID, not the human label).
aa-core = { git = "https://github.com/ai-agent-assembly/agent-assembly.git", rev = "d4093e89b07d8ba1c38e6caa92637d2e8edb65d7", package = "aa-core", features = ["serde"] }
aa-proto = { git = "https://github.com/ai-agent-assembly/agent-assembly.git", rev = "d4093e89b07d8ba1c38e6caa92637d2e8edb65d7", package = "aa-proto" }
aa-sdk-client = { git = "https://github.com/ai-agent-assembly/agent-assembly.git", rev = "d4093e89b07d8ba1c38e6caa92637d2e8edb65d7", package = "aa-sdk-client" }
prost = "0.14"
pyo3 = { version = "0.30", features = ["extension-module"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# `AssemblyClient::register` is async (tonic gRPC). The shim's `register`
# surface is synchronous, so it drives that future on a private current-thread
# runtime — hence only the `rt` feature is needed here.
tokio = { version = "1", features = ["rt"] }
